# ============================================================================
# FilePortal configuration
# ----------------------------------------------------------------------------
# Edit this file, then restart FilePortal.
# Format: key = value. Blank values fall back to safe defaults where supported.
# ============================================================================

[Server]
# HTTP port. If you use a reverse proxy or tunnel, point it to this port.
port = 8000

# 0.0.0.0 listens on all interfaces. Use 127.0.0.1 for local-only access.
host = 0.0.0.0

# The folder exposed by the web UI. Use an absolute path.
# Source edition: you MUST set this before first start.
# Portable/Linux editions: the launcher fills this with the current user's Documents folder.
projection_root =
root =

# Leave blank to auto-size the worker pool.
workers =
zip_slots = 2
upload_slots = 4
list_cache_seconds = 3
per_page = 60
request_timeout = 60
trash_days = 30

# HTTPS is optional. Leave both blank for plain HTTP.
certfile =
keyfile =
https_port = 0

# The built-in administrator account name.
admin_name = Admin


[Download]
file_threads = 16
zip_threads = 12
threaded_max_mb = 64
zip_cache_max_mb = 256
zip_cache_minutes = 30
save_picker = 1
dl_token_hours = 12
thumb_source_max_mb = 20
thumb_max_px = 320


[Lists]
# Any .txt/.csv/.xlsx/.xlsm/.docx in these folders is read as a name list.
# Empty lists mean no restriction (the allowlist is effectively disabled).
whitelist_dir = data/lists/whitelist
blacklist_dir = data/lists/blacklist
whitelist_enforce = 1


[Passwords]
# Change every password before exposing this service to a network.
PW_FULL = ChangeMe_123
PW_STUDY = ChangeMe_Study
PW_READ = ChangeMe_Read

# Dedicated password for /admin. Leave blank to reuse PW_FULL.
admin_password = ChangeMe_Admin

legacy_password =

# The name required for the full-access role. Keep Admin for the initial account.
full_name = Admin

study_subpath = Study
session_days = 7


[Login protection]
login_max_fails = 8
login_lock_seconds = 90
login_lock_max_seconds = 900
login_rate_per_minute = 12
login_burst = 24
login_fail_delay_ms = 200
login_fail_delay_max_ms = 1500


[Permissions]
full_perms = download, preview, zip, upload, mkdir, rename, delete
study_perms = download, preview, zip, upload, mkdir
read_perms = download, preview, zip


[Footer]
show_footer = false
site_code =
icp_no =
icp_url = https://beian.miit.gov.cn/
police_no =
police_url = https://beian.mps.gov.cn/#/query/webSearch?code=


[Cloud]
# Private workspaces for registered users (relative to the runtime data folder).
cloud_root = FilePortalCloud
register_enabled = 1
register_notice_seconds = 5
contact_wechat =
contact_phone =
contact_email =
register_daily_limit = 1
avatar_max_kb = 2048
upload_parallel = 3
upload_max_mb = 4096
user_quota_mb = 10240
log_days = 90
