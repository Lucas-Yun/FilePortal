name: 功能建议
description: 提出新功能、体验改进或兼容性需求
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        功能建议会结合项目定位、跨平台成本、安全影响和维护负担评估。请尽量说明真实使用场景，而不是只描述实现方式。

  - type: dropdown
    id: edition
    attributes:
      label: 相关版本
      options:
        - 全部版本
        - Windows 源码版
        - Windows 单文件便携版
        - Linux 源码版
        - 不确定
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 当前痛点
      description: 现在遇到了什么问题？在什么场景下发生？
      placeholder: 例如：教室里没有 IT 管理员，学生上传作业后老师需要按班级批量打包。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望行为
      description: 你希望用户看到或体验到什么？不必限定具体实现。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 目前如何绕过？是否试过其他工具或配置？

  - type: textarea
    id: scope
    attributes:
      label: 影响范围与风险
      description: 是否涉及权限、登录、路径、上传、下载、账号或数据迁移？是否影响旧配置？
      placeholder: 例如：新增只读角色，不影响现有 Admin 登录。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue 和文档，确认不是已有功能或重复建议。
          required: true
        - label: 我理解维护者不保证采纳每个建议。
          required: true
