name: Normalize history

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.repository == 'Lucas-Yun/FilePortal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Collapse history and normalize author
        run: |
          if [ -f .github/.history-normalized ]; then
            echo "History already normalized"
            exit 0
          fi
          git config user.name "Lucas-Yun"
          git config user.email "200024866+Lucas-Yun@users.noreply.github.com"
          touch .github/.history-normalized
          git checkout --orphan clean-history
          git add -A
          git commit -m "FilePortal v1.0.0"
          git push --force origin clean-history:main
          git tag -f v1.0.0 HEAD
          git push --force origin v1.0.0
